<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 305" width="680" height="305">
  <defs>
    <linearGradient id="tb_aws-part-6-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="305" rx="10" fill="url(#tb_aws-part-6-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">AWS + Linux — Systemd Services</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">[ec2-user ~]$ sudo systemctl status nginx</text>
    <text x="20" y="77" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">● nginx.service - The nginx HTTP Server</text>
    <text x="20" y="99" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">   Active: active (running) since Mon 14:30:01</text>
    <text x="20" y="121" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">   Main PID: 1234 (nginx)</text>
    <text x="20" y="143" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">   Memory: 12.4M</text>
    <text x="20" y="165" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="187" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">[ec2-user ~]$ sudo systemctl list-units --type=service</text>
    <text x="20" y="209" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">  nginx.service        active  running</text>
    <text x="20" y="231" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">  sshd.service         active  running</text>
    <text x="20" y="253" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">  amazon-ssm.service   active  running</text>
</svg>