    <text x="20" y="121" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ kubectl get pvc</text>
    <text x="20" y="143" fill="#86868b" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">NAME         STATUS   VOLUME   CAPACITY   CLASS</text>
    <text x="20" y="165" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">db-storage   Bound    pv-001   10Gi       standard</text>
    <text x="20" y="187" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
