<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 327" width="680" height="327">
  <defs>
    <linearGradient id="tb_linux-part-7-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="327" rx="10" fill="url(#tb_linux-part-7-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Linux — Package Management</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ sudo apt update</text>
    <text x="20" y="77" fill="#86868b" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Hit:1 http://archive.ubuntu.com/ubuntu noble InRelease</text>
    <text x="20" y="99" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Reading package lists... Done</text>
    <text x="20" y="121" fill="#febc2e" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">87 packages can be upgraded.</text>
    <text x="20" y="143" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="165" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ sudo apt install nginx -y</text>
    <text x="20" y="187" fill="#86868b" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Setting up nginx (1.24.0-2) ...</text>
    <text x="20" y="209" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">nginx.service: Started</text>
    <text x="20" y="231" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="253" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ dpkg -l | grep nginx</text>
    <text x="20" y="275" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">ii  nginx  1.24.0-2  amd64  high performance web server</text>
</svg>