<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280">
  <rect width="680" height="280" rx="12" fill="#f8f8fa"/>
  <text x="340" y="35" fill="#1d1d1f" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">Beginner vs Experienced Engineer</text>
  <rect x="20" y="50" width="310" height="28" rx="6" fill="#fd7e14" opacity="0.15"/>
  <text x="175" y="69" fill="#fd7e14" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Beginner with AI</text>
  <rect x="350" y="50" width="310" height="28" rx="6" fill="#28a745" opacity="0.15"/>
  <text x="505" y="69" fill="#28a745" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Engineer with AI</text>
  <line x1="340" y1="50" x2="340" y2="260" stroke="#d1d1d6" stroke-width="1"/>
  <text x="36" y="98" fill="#515154" font-family="sans-serif" font-size="12">• Copies AI output directly</text>
  <text x="36" y="130" fill="#515154" font-family="sans-serif" font-size="12">• Cannot debug failures</text>
  <text x="36" y="162" fill="#515154" font-family="sans-serif" font-size="12">• No mental model of system</text>
  <text x="36" y="194" fill="#515154" font-family="sans-serif" font-size="12">• Relies on AI for decisions</text>
  <text x="366" y="98" fill="#515154" font-family="sans-serif" font-size="12">• Uses AI as accelerator</text>
  <text x="366" y="130" fill="#515154" font-family="sans-serif" font-size="12">• Understands why code works</text>
  <text x="366" y="162" fill="#515154" font-family="sans-serif" font-size="12">• Designs full system</text>
  <text x="366" y="194" fill="#515154" font-family="sans-serif" font-size="12">• Makes informed judgments</text>
  <text x="366" y="226" fill="#515154" font-family="sans-serif" font-size="12">• Handles edge cases</text>
</svg>