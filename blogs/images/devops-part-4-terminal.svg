<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 371" width="680" height="371">
  <defs>
    <linearGradient id="tb_devops-part-4-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="371" rx="10" fill="url(#tb_devops-part-4-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Infrastructure as Code</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ cat main.tf</text>
    <text x="20" y="77" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">resource "aws_instance" "web" {</text>
    <text x="20" y="99" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">  ami           = "ami-0c55b159cbfafe1f0"</text>
    <text x="20" y="121" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">  instance_type = "t3.micro"</text>
    <text x="20" y="143" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">  tags = { Name = "web-server" }</text>
    <text x="20" y="165" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">}</text>
    <text x="20" y="187" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="209" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ terraform plan</text>
    <text x="20" y="231" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Plan: 1 to add, 0 to change, 0 to destroy</text>
    <text x="20" y="253" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="275" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ terraform apply -auto-approve</text>
    <text x="20" y="297" fill="#86868b" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">aws_instance.web: Creating...</text>
    <text x="20" y="319" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Apply complete! Resources: 1 added</text>
