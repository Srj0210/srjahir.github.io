<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 327" width="680" height="327">
  <defs>
    <linearGradient id="tb_linux-part-11-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="327" rx="10" fill="url(#tb_linux-part-11-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Linux — Cron & Automation</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ crontab -l</text>
    <text x="20" y="77" fill="#86868b" font-family="'SF Mono', 'Fira Code', monospace" font-size="13"># Backup database every day at 2 AM</text>
    <text x="20" y="99" fill="#0071e3" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">0 2 * * * /home/suraj/scripts/backup.sh</text>
    <text x="20" y="121" fill="#86868b" font-family="'SF Mono', 'Fira Code', monospace" font-size="13"># Clear temp files every Sunday</text>
    <text x="20" y="143" fill="#0071e3" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">0 0 * * 0 find /tmp -mtime +7 -delete</text>
    <text x="20" y="165" fill="#86868b" font-family="'SF Mono', 'Fira Code', monospace" font-size="13"># Health check every 5 minutes</text>
    <text x="20" y="187" fill="#0071e3" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">*/5 * * * * curl -s https://myapp.com/health</text>
    <text x="20" y="209" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13"></text>
    <text x="20" y="231" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ systemctl list-timers --all</text>
    <text x="20" y="253" fill="#86868b" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">NEXT                     UNIT</text>
    <text x="20" y="275" fill="#28c840" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">Sun 2025-10-16 02:00 UTC backup.timer</text>
</svg>