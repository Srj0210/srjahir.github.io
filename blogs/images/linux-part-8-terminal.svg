<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 305" width="680" height="305">
  <defs>
    <linearGradient id="tb_linux-part-8-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="305" rx="10" fill="url(#tb_linux-part-8-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Linux — Disk & Storage</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ df -h</text>
    <text x="20" y="77" fill="#86868b" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">Filesystem      Size  Used  Avail  Use%  Mounted on</text>
    <text x="20" y="99" fill="#28c840" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">/dev/sda1        50G   18G    30G   38%  /</text>
    <text x="20" y="121" fill="#febc2e" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">/dev/sdb1       200G  145G    47G   76%  /data</text>
    <text x="20" y="143" fill="#28c840" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">tmpfs            4G    0     4G     0%  /tmp</text>
    <text x="20" y="165" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13"></text>
    <text x="20" y="187" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ lsblk</text>
    <text x="20" y="209" fill="#86868b" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">NAME   SIZE  TYPE  MOUNTPOINT</text>
    <text x="20" y="231" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">sda     50G  disk</text>
    <text x="20" y="253" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">sdb    200G  disk</text>
</svg>