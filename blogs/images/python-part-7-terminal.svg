<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 283" width="680" height="283">
  <defs>
    <linearGradient id="tb_python-part-7-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="283" rx="10" fill="url(#tb_python-part-7-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Python — Python Error Handling</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#f7df1e" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">&gt;&gt;&gt; try:</text>
    <text x="20" y="77" fill="#f7df1e" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">...     result = 10 / 0</text>
    <text x="20" y="99" fill="#f7df1e" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">... except ZeroDivisionError as e:</text>
    <text x="20" y="121" fill="#f7df1e" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">...     print(f'Error: {e}')</text>
    <text x="20" y="143" fill="#ff5f57" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">Error: division by zero</text>
    <text x="20" y="165" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13"></text>
    <text x="20" y="187" fill="#86868b" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">&gt;&gt;&gt; # Program continues running</text>
    <text x="20" y="209" fill="#f7df1e" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">&gt;&gt;&gt; print('Still alive!')</text>
    <text x="20" y="231" fill="#28c840" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">Still alive!</text>
</svg>