<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280">
  <rect width="680" height="280" rx="12" fill="#f8f8fa"/>
  <text x="340" y="35" fill="#1d1d1f" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">Long-term vs Short-term Investing</text>
  <rect x="20" y="50" width="310" height="28" rx="6" fill="#e63946" opacity="0.15"/>
  <text x="175" y="69" fill="#e63946" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Short-term Trading</text>
  <rect x="350" y="50" width="310" height="28" rx="6" fill="#28a745" opacity="0.15"/>
  <text x="505" y="69" fill="#28a745" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Long-term Investing</text>
  <line x1="340" y1="50" x2="340" y2="260" stroke="#d1d1d6" stroke-width="1"/>
  <text x="36" y="98" fill="#515154" font-family="sans-serif" font-size="12">• High transaction costs</text>
  <text x="36" y="130" fill="#515154" font-family="sans-serif" font-size="12">• Emotional decisions</text>
  <text x="36" y="162" fill="#515154" font-family="sans-serif" font-size="12">• Tax inefficient</text>
  <text x="36" y="194" fill="#515154" font-family="sans-serif" font-size="12">• Most traders lose money</text>
  <text x="366" y="98" fill="#515154" font-family="sans-serif" font-size="12">• Compounding works for you</text>
  <text x="366" y="130" fill="#515154" font-family="sans-serif" font-size="12">• Survives market cycles</text>
  <text x="366" y="162" fill="#515154" font-family="sans-serif" font-size="12">• Lower stress and costs</text>
  <text x="366" y="194" fill="#515154" font-family="sans-serif" font-size="12">• Historical data supports it</text>
  <text x="366" y="226" fill="#515154" font-family="sans-serif" font-size="12">• Time in market > timing</text>
</svg>