<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280">
  <rect width="680" height="280" rx="12" fill="#f8f8fa"/>
  <text x="340" y="35" fill="#1d1d1f" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">Certification vs Real Skills</text>
  <rect x="20" y="50" width="310" height="28" rx="6" fill="#fd7e14" opacity="0.15"/>
  <text x="175" y="69" fill="#fd7e14" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Certification Alone</text>
  <rect x="350" y="50" width="310" height="28" rx="6" fill="#28a745" opacity="0.15"/>
  <text x="505" y="69" fill="#28a745" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Certification + Practice</text>
  <line x1="340" y1="50" x2="340" y2="260" stroke="#d1d1d6" stroke-width="1"/>
  <text x="36" y="98" fill="#515154" font-family="sans-serif" font-size="12">• Passes multiple choice</text>
  <text x="36" y="130" fill="#515154" font-family="sans-serif" font-size="12">• Knows theory well</text>
  <text x="36" y="162" fill="#515154" font-family="sans-serif" font-size="12">• Cannot troubleshoot live</text>
  <text x="36" y="194" fill="#515154" font-family="sans-serif" font-size="12">• Struggles under pressure</text>
  <text x="366" y="98" fill="#515154" font-family="sans-serif" font-size="12">• Passes exams confidently</text>
  <text x="366" y="130" fill="#515154" font-family="sans-serif" font-size="12">• Builds real infrastructure</text>
  <text x="366" y="162" fill="#515154" font-family="sans-serif" font-size="12">• Debugs production issues</text>
  <text x="366" y="194" fill="#515154" font-family="sans-serif" font-size="12">• Makes architecture decisions</text>
  <text x="366" y="226" fill="#515154" font-family="sans-serif" font-size="12">• Handles unexpected failures</text>
</svg>