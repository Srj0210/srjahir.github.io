<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 349" width="680" height="349">
  <defs>
    <linearGradient id="tb_aws-part-3-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="349" rx="10" fill="url(#tb_aws-part-3-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">AWS + Linux — Linux on EC2</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">[ec2-user@ip-10-0-1-5 ~]$ sudo yum update -y</text>
    <text x="20" y="77" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Updated: 23 packages</text>
    <text x="20" y="99" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="121" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">[ec2-user@ip-10-0-1-5 ~]$ sudo yum install nginx -y</text>
    <text x="20" y="143" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Installed: nginx-1.24.0</text>
    <text x="20" y="165" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="187" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">[ec2-user@ip-10-0-1-5 ~]$ sudo systemctl start nginx</text>
    <text x="20" y="209" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">[ec2-user@ip-10-0-1-5 ~]$ sudo systemctl enable nginx</text>
    <text x="20" y="231" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Created symlink</text>
    <text x="20" y="253" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="275" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">[ec2-user@ip-10-0-1-5 ~]$ curl localhost</text>
    <text x="20" y="297" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Welcome to nginx on Amazon Linux!</text>
</svg>