<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 327" width="680" height="327">
  <defs>
    <linearGradient id="tb_linux-part-9-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="327" rx="10" fill="url(#tb_linux-part-9-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Linux — Environment Variables</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ echo $PATH</text>
    <text x="20" y="77" fill="#28c840" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">/usr/local/bin:/usr/bin:/bin:/home/suraj/.local/bin</text>
    <text x="20" y="99" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13"></text>
    <text x="20" y="121" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ export API_KEY='sk-abc123def456'</text>
    <text x="20" y="143" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ export NODE_ENV='production'</text>
    <text x="20" y="165" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13"></text>
    <text x="20" y="187" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ cat ~/.bashrc | tail -5</text>
    <text x="20" y="209" fill="#0071e3" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">export PATH=$PATH:$HOME/.local/bin</text>
    <text x="20" y="231" fill="#0071e3" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">export EDITOR=vim</text>
    <text x="20" y="253" fill="#0071e3" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">alias ll='ls -alF'</text>
    <text x="20" y="275" fill="#0071e3" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">alias gs='git status'</text>
</svg>