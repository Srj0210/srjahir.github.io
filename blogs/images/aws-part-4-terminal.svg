    <text x="20" y="121" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ aws s3 cp ./backup.tar.gz s3://my-project-bucket-2025/</text>
    <text x="20" y="143" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">upload: ./backup.tar.gz to s3://my-project-bucket-2025/</text>
