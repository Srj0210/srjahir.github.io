      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="305" rx="10" fill="url(#tb_linux-part-4-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Linux — Text Processing</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ cat access.log | grep &apos;ERROR&apos; | wc -l</text>
    <text x="20" y="77" fill="#ff5f57" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">47</text>
    <text x="20" y="99" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="121" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ awk &apos;{print $1}&apos; access.log | sort | uniq -c | sort -rn | head</text>
    <text x="20" y="143" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">  1523 192.168.1.100</text>
    <text x="20" y="165" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">   847 10.0.0.5</text>
    <text x="20" y="187" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">   234 172.16.0.1</text>
    <text x="20" y="209" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="231" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ sed -i &apos;s/localhost/0.0.0.0/g&apos; config.yml</text>
    <text x="20" y="253" fill="#86868b" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"># Replaced all &apos;localhost&apos; with &apos;0.0.0.0&apos;</text>
</svg>