<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 327" width="680" height="327">
  <defs>
    <linearGradient id="tb_linux-part-1-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="327" rx="10" fill="url(#tb_linux-part-1-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Linux — Getting Started</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ uname -a</text>
    <text x="20" y="77" fill="#28c840" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">Linux server 5.15.0-91 #1 SMP x86_64 GNU/Linux</text>
    <text x="20" y="99" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13"></text>
    <text x="20" y="121" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ whoami</text>
    <text x="20" y="143" fill="#28c840" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">suraj</text>
    <text x="20" y="165" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ pwd</text>
    <text x="20" y="187" fill="#28c840" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">/home/suraj</text>
    <text x="20" y="209" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ ls -la</text>
    <text x="20" y="231" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">drwxr-xr-x  5 suraj suraj 4096 Oct 15 14:30 .</text>
    <text x="20" y="253" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">drwxr-xr-x  3 root  root  4096 Oct 10 09:00 ..</text>
    <text x="20" y="275" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">-rw-r--r--  1 suraj suraj  220 Oct 10 09:00 .bashrc</text>
