<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 349" width="680" height="349">
  <defs>
    <linearGradient id="tb_linux-part-6-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="349" rx="10" fill="url(#tb_linux-part-6-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Linux — Networking</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ ip addr show eth0</text>
    <text x="20" y="77" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">2: eth0: &lt;BROADCAST,MULTICAST,UP&gt; mtu 1500</text>
    <text x="20" y="99" fill="#28c840" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">    inet 10.0.1.5/24 brd 10.0.1.255 scope global</text>
    <text x="20" y="121" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13"></text>
    <text x="20" y="143" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ ss -tlnp</text>
    <text x="20" y="165" fill="#86868b" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">State    Recv-Q  Local Address:Port  Process</text>
    <text x="20" y="187" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">LISTEN   0       0.0.0.0:22         sshd</text>
    <text x="20" y="209" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">LISTEN   0       0.0.0.0:80         nginx</text>
    <text x="20" y="231" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">LISTEN   0       0.0.0.0:8000       python3</text>
    <text x="20" y="253" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13"></text>
    <text x="20" y="275" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ curl -I https://srjahir.in</text>
    <text x="20" y="297" fill="#28c840" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">HTTP/2 200</text>
</svg>