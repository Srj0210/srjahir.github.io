  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Python — Python Data Structures</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#f7df1e" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">&gt;&gt;&gt; fruits = [&apos;apple&apos;, &apos;banana&apos;, &apos;mango&apos;]</text>
    <text x="20" y="77" fill="#f7df1e" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">&gt;&gt;&gt; fruits.append(&apos;orange&apos;)</text>
    <text x="20" y="99" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">&gt;&gt;&gt; len(fruits)</text>
    <text x="20" y="121" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">4</text>
    <text x="20" y="143" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="165" fill="#f7df1e" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">&gt;&gt;&gt; user = {&apos;name&apos;: &apos;Suraj&apos;, &apos;role&apos;: &apos;engineer&apos;}</text>
    <text x="20" y="187" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">&gt;&gt;&gt; user[&apos;name&apos;]</text>
    <text x="20" y="209" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">&apos;Suraj&apos;</text>
