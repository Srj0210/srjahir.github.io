<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 283" width="680" height="283">
  <defs>
    <linearGradient id="tb_python-part-9-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="283" rx="10" fill="url(#tb_python-part-9-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Python — Python Modules</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ pip install requests</text>
    <text x="20" y="77" fill="#28c840" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">Successfully installed requests-2.31.0</text>
    <text x="20" y="99" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13"></text>
    <text x="20" y="121" fill="#f7df1e" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">&gt;&gt;&gt; import requests</text>
    <text x="20" y="143" fill="#f7df1e" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">&gt;&gt;&gt; r = requests.get('https://api.github.com')</text>
    <text x="20" y="165" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">&gt;&gt;&gt; r.status_code</text>
    <text x="20" y="187" fill="#28c840" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">200</text>
    <text x="20" y="209" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">&gt;&gt;&gt; r.json()['current_user_url']</text>
    <text x="20" y="231" fill="#28c840" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">'https://api.github.com/user'</text>
</svg>