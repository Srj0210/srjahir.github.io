    <text x="20" y="55" fill="#f7df1e" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">&gt;&gt;&gt; class Server:</text>
    <text x="20" y="77" fill="#f7df1e" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">...     def __init__(self, name, ip):</text>
