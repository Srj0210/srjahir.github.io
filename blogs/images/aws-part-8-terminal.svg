<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 393" width="680" height="393">
  <defs>
    <linearGradient id="tb_aws-part-8-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="393" rx="10" fill="url(#tb_aws-part-8-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">AWS + Linux — Bash Scripting</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ cat deploy.sh</text>
    <text x="20" y="77" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">#!/bin/bash</text>
    <text x="20" y="99" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">set -euo pipefail</text>
    <text x="20" y="121" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="143" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">echo "Starting deployment..."</text>
    <text x="20" y="165" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">cd /var/www/myapp</text>
    <text x="20" y="187" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">git pull origin main</text>
    <text x="20" y="209" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">pip install -r requirements.txt</text>
    <text x="20" y="231" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">sudo systemctl restart myapp</text>
    <text x="20" y="253" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">echo "Deploy complete!"</text>
    <text x="20" y="275" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="297" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ chmod +x deploy.sh &amp;&amp; ./deploy.sh</text>
    <text x="20" y="319" fill="#86868b" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Starting deployment...</text>
    <text x="20" y="341" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Deploy complete!</text>
</svg>