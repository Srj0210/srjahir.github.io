<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 327" width="680" height="327">
  <defs>
    <linearGradient id="tb_devops-part-2-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="327" rx="10" fill="url(#tb_devops-part-2-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Git Fundamentals</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ git init myproject &amp;&amp; cd myproject</text>
    <text x="20" y="77" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Initialized empty Git repository</text>
    <text x="20" y="99" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="121" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ git add . &amp;&amp; git commit -m &apos;Initial commit&apos;</text>
    <text x="20" y="143" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">[main (root-commit) a1b2c3d] Initial commit</text>
    <text x="20" y="165" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="187" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ git checkout -b feature/auth</text>
    <text x="20" y="209" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Switched to a new branch &apos;feature/auth&apos;</text>
    <text x="20" y="231" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="253" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ git log --oneline --graph</text>
    <text x="20" y="275" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">* a1b2c3d (HEAD -&gt; feature/auth) Initial commit</text>
</svg>