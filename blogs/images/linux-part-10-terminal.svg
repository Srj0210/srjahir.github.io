<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 305" width="680" height="305">
  <defs>
    <linearGradient id="tb_linux-part-10-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="305" rx="10" fill="url(#tb_linux-part-10-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Linux — Logging &amp; Monitoring</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ journalctl -u nginx --since &apos;1 hour ago&apos;</text>
    <text x="20" y="77" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Oct 15 14:30:01 server nginx[1234]: started</text>
    <text x="20" y="99" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Oct 15 14:31:15 server nginx[1234]: GET /api 200</text>
    <text x="20" y="121" fill="#ff5f57" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Oct 15 14:32:08 server nginx[1234]: GET /img 404</text>
    <text x="20" y="143" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="165" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ tail -f /var/log/syslog | grep -i error</text>
    <text x="20" y="187" fill="#ff5f57" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Oct 15 14:35:22 server app[5678]: ConnectionError</text>
    <text x="20" y="209" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="231" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ dmesg | tail -3</text>
    <text x="20" y="253" fill="#86868b" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">[42195.123] EXT4-fs: mounted filesystem with ordered data</text>
</svg>