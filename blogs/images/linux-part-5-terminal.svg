<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 305" width="680" height="305">
  <defs>
    <linearGradient id="tb_linux-part-5-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="305" rx="10" fill="url(#tb_linux-part-5-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Linux — Process Management</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ ps aux | head -5</text>
    <text x="20" y="77" fill="#86868b" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">USER   PID  %CPU  %MEM  COMMAND</text>
    <text x="20" y="99" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">root     1   0.0   0.1  /sbin/init</text>
    <text x="20" y="121" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">root   423   0.2   1.5  /usr/bin/dockerd</text>
    <text x="20" y="143" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">suraj  891   1.5   3.2  python3 app.py</text>
    <text x="20" y="165" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="187" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ top -bn1 | head -3</text>
    <text x="20" y="209" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Tasks: 142 total, 2 running, 140 sleeping</text>
    <text x="20" y="231" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">Cpu(s): 12.5% us, 3.1% sy, 84.4% id</text>
    <text x="20" y="253" fill="#febc2e" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">MiB Mem: 7962 total, 2341 free, 3128 used</text>
</svg>