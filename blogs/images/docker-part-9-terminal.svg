<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 349" width="680" height="349">
  <defs>
    <linearGradient id="tb_docker-part-9-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="349" rx="10" fill="url(#tb_docker-part-9-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Docker — Multi-stage Builds</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ cat Dockerfile</text>
    <text x="20" y="77" fill="#86868b" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"># Build stage</text>
    <text x="20" y="99" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">FROM node:20 AS builder</text>
    <text x="20" y="121" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">WORKDIR /app</text>
    <text x="20" y="143" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">COPY package*.json ./</text>
    <text x="20" y="165" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">RUN npm ci &amp;&amp; npm run build</text>
    <text x="20" y="187" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="209" fill="#86868b" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"># Production stage</text>
    <text x="20" y="231" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">FROM nginx:alpine</text>
    <text x="20" y="253" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">COPY --from=builder /app/dist /usr/share/nginx/html</text>
    <text x="20" y="275" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="297" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"># Image: 23MB instead of 1.2GB!</text>
</svg>