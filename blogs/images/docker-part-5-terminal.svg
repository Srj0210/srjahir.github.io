<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 261" width="680" height="261">
  <defs>
    <linearGradient id="tb_docker-part-5-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="261" rx="10" fill="url(#tb_docker-part-5-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Docker — Docker Networking</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ docker network create app-net</text>
    <text x="20" y="77" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">8f2a1b3c4d5e6f7a8b9c0d1e2f3a4b5c</text>
    <text x="20" y="99" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="121" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ docker run -d --network app-net --name db redis</text>
    <text x="20" y="143" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ docker run -d --network app-net --name web myapp</text>
    <text x="20" y="165" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="187" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ docker network inspect app-net</text>
    <text x="20" y="209" fill="#86868b" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">  Containers: db (172.18.0.2), web (172.18.0.3)</text>
</svg>