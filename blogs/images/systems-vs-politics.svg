  <text x="366" y="98" fill="#515154" font-family="sans-serif" font-size="12">• Institutions persist decades</text>
  <text x="366" y="130" fill="#515154" font-family="sans-serif" font-size="12">• Rule-based governance</text>
  <text x="366" y="162" fill="#515154" font-family="sans-serif" font-size="12">• Long-term stability</text>
