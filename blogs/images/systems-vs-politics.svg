<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 280" width="680" height="280">
  <rect width="680" height="280" rx="12" fill="#f8f8fa"/>
  <text x="340" y="35" fill="#1d1d1f" font-family="sans-serif" font-size="18" font-weight="600" text-anchor="middle">Systems vs Politics</text>
  <rect x="20" y="50" width="310" height="28" rx="6" fill="#86868b" opacity="0.15"/>
  <text x="175" y="69" fill="#86868b" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">Political Decisions</text>
  <rect x="350" y="50" width="310" height="28" rx="6" fill="#0071e3" opacity="0.15"/>
  <text x="505" y="69" fill="#0071e3" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">System Foundations</text>
  <line x1="340" y1="50" x2="340" y2="260" stroke="#d1d1d6" stroke-width="1"/>
  <text x="36" y="98" fill="#515154" font-family="sans-serif" font-size="12">• Change every election</text>
