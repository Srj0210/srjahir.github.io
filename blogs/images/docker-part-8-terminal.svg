<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 305" width="680" height="305">
  <defs>
    <linearGradient id="tb_docker-part-8-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="305" rx="10" fill="url(#tb_docker-part-8-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Docker — Docker Logs</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ docker logs web --tail 20</text>
    <text x="20" y="77" fill="#28c840" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">[2025-10-15 14:32:01] Server started on port 8000</text>
    <text x="20" y="99" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">[2025-10-15 14:32:15] GET /api/users 200 12ms</text>
    <text x="20" y="121" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">[2025-10-15 14:32:18] GET /api/data  200 45ms</text>
    <text x="20" y="143" fill="#ff5f57" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">[2025-10-15 14:33:01] POST /api/auth 401 3ms</text>
    <text x="20" y="165" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13"></text>
    <text x="20" y="187" fill="#98989d" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">$ docker stats --no-stream</text>
    <text x="20" y="209" fill="#86868b" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">NAME   CPU %   MEM USAGE    NET I/O</text>
    <text x="20" y="231" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">web    0.5%    128MiB       2.1kB / 1.8kB</text>
    <text x="20" y="253" fill="#fff" font-family="'SF Mono', 'Fira Code', monospace" font-size="13">db     1.2%    256MiB       890B / 620B</text>
