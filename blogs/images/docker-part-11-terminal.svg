<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 327" width="680" height="327">
  <defs>
    <linearGradient id="tb_docker-part-11-terminal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#2c2c2e"/>
    </linearGradient>
  </defs>
  <rect width="680" height="327" rx="10" fill="url(#tb_docker-part-11-terminal)"/>
  <circle cx="18" cy="16" r="6" fill="#ff5f57"/>
  <circle cx="38" cy="16" r="6" fill="#febc2e"/>
  <circle cx="58" cy="16" r="6" fill="#28c840"/>
  <text x="340" y="18" fill="#98989d" font-family="sans-serif" font-size="12" text-anchor="middle">Docker — Docker CI/CD</text>
  <line x1="0" y1="32" x2="680" y2="32" stroke="#48484a" stroke-width="0.5"/>
    <text x="20" y="55" fill="#98989d" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">$ cat .github/workflows/deploy.yml</text>
    <text x="20" y="77" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">name: Build &amp; Deploy</text>
    <text x="20" y="99" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">on: push</text>
    <text x="20" y="121" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">jobs:</text>
    <text x="20" y="143" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">  build:</text>
    <text x="20" y="165" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">    steps:</text>
    <text x="20" y="187" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">      - docker build -t app:$SHA .</text>
    <text x="20" y="209" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">      - docker push registry/app:$SHA</text>
    <text x="20" y="231" fill="#0071e3" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">      - kubectl set image deploy/app app=app:$SHA</text>
    <text x="20" y="253" fill="#fff" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13"></text>
    <text x="20" y="275" fill="#28c840" font-family="SF Mono, Fira Code, Consolas, monospace" font-size="13">✓ Build succeeded  ✓ Tests passed  ✓ Deployed</text>
</svg>