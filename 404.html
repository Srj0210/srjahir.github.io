<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>404 — Page Not Found | SRJahir Tech</title>
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="X-Content-Type-Options" content="nosniff" />
  <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />
  <link rel="icon" type="image/png" href="logo.png" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <style>
    main{min-height:80vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem;}
    .error-code{font-size:5.5rem;color:#e63946;font-weight:700;margin-bottom:.5rem;animation:pulse 1.4s ease-in-out infinite;}
    @keyframes pulse{0%{opacity:.7;transform:scale(1);}50%{opacity:1;transform:scale(1.1);}100%{opacity:.7;transform:scale(1);}}
    h2{color:#111;margin-bottom:.5rem;}p{color:#555;max-width:500px;margin:0 auto 1.5rem;}
  </style>
</head>
<body>
  <header class="nav"><h1>SRJahir<span>Tech</span></h1></header>
  <main>
    <div class="error-code" aria-hidden="true">404</div>
    <h2>Page Not Found</h2>
    <p>Sorry, the page you're looking for doesn't exist or has been moved.</p>
    <a href="/" class="btn">&#8592; Go Back Home</a>
  </main>
  <footer>
    <p>&copy; 2026 SRJahir Tech &mdash; Cloud &bull; AI &bull; Web</p>
    <img src="sanskrit.png" alt="" class="footer-art" aria-hidden="true" loading="lazy" />
  </footer>
  <script>setTimeout(()=>{window.location.href="/";},6000);</script>
</body>
</html>
